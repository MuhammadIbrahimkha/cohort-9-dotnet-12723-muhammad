name: CI/CD
on:
  push: { branches: [develop, main] }
  pull_request: { branches: [develop, main] }
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet restore TaskManagementTool.sln
      - run: dotnet build TaskManagementTool.sln -c Release --no-restore
      - run: dotnet test TaskManagementTool.sln -c Release --no-build
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: task-management-client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: task-management-client/package-lock.json }
      - run: npm ci
      - run: npm run build
  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet publish server/TaskManagement.API/TaskManagement.API.csproj -c Release -o publish
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
