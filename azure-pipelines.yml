trigger:
  branches:
    include:
      - develop
      - main

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: azure-taskmgmt
  webAppName: taskmgmt-ibrahim-api

stages:
  - stage: Build
    displayName: Build and test
    jobs:
      - job: Backend
        displayName: Backend (.NET 8)
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: 8.0.x
          - script: dotnet restore TaskManagementTool/TaskManagementTool.sln
            displayName: Restore
          - script: dotnet build TaskManagementTool/TaskManagementTool.sln -c Release --no-restore
            displayName: Build
          - script: dotnet test TaskManagementTool/TaskManagementTool.sln -c Release --no-build
            displayName: Run unit tests
          - script: dotnet publish server/TaskManagement.API/TaskManagement.API.csproj -c Release -o $(Build.ArtifactStagingDirectory)/api
            displayName: Publish API
          - publish: $(Build.ArtifactStagingDirectory)/api
            artifact: api

      - job: Frontend
        displayName: Frontend (React)
        steps:
          - task: UseNode@1
            inputs:
              version: 20.x
          - script: npm ci && npm run build
            workingDirectory: task-management-client
            displayName: Install and build

  - stage: Deploy
    displayName: Deploy API to Azure App Service
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - job: DeployApi
        displayName: Deploy to App Service
        steps:
          - download: current
            artifact: api
          - task: AzureWebApp@1
            displayName: Deploy API
            inputs:
              azureSubscription: $(azureServiceConnection)
              appType: webAppLinux
              appName: $(webAppName)
              package: $(Pipeline.Workspace)/api
