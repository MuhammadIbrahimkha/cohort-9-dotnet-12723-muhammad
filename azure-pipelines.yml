trigger:
  branches:
    include:
      - develop
      - main

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: azure-taskmgmt
  webAppName: taskmgmt-ibrahim-api
  apiUrl: https://taskmgmt-ibrahim-api-dwekfce7efd9h7fe.centralindia-01.azurewebsites.net/api

stages:
  - stage: Build
    displayName: Build and test
    jobs:
      - job: Backend
        displayName: Backend (.NET 10)
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: 10.0.x
          - script: dotnet restore TaskManagementTool/TaskManagementTool.sln
            displayName: Restore
          - script: dotnet build TaskManagementTool/TaskManagementTool.sln -c Release --no-restore
            displayName: Build
          - script: dotnet test TaskManagementTool/TaskManagementTool.sln -c Release --no-build
            displayName: Run unit tests
          - script: dotnet publish server/TaskManagement.API/TaskManagement.API.csproj -c Release -o $(Build.ArtifactStagingDirectory)/api
            displayName: Publish API
          - publish: $(Build.ArtifactStagingDirectory)/api
            artifact: api

      - job: Frontend
        displayName: Frontend (React)
        steps:
          - task: UseNode@1
            inputs:
              version: 20.x
          - script: npm ci && npm run build
            workingDirectory: task-management-client
            displayName: Install and build
            env:
              VITE_API_URL: $(apiUrl)

  - stage: Deploy
    displayName: Deploy to Azure
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - job: DeployApi
        displayName: Deploy API to App Service
        steps:
          - download: current
            artifact: api
          - task: AzureWebApp@1
            displayName: Deploy API
            inputs:
              azureSubscription: $(azureServiceConnection)
              appType: webAppLinux
              appName: $(webAppName)
              package: $(Pipeline.Workspace)/api

      - job: DeployWeb
        displayName: Deploy React app to Static Web Apps
        steps:
          - task: UseNode@1
            inputs:
              version: 20.x
          - script: npm ci && npm run build
            workingDirectory: task-management-client
            displayName: Build React app for production
            env:
              VITE_API_URL: $(apiUrl)
          - task: AzureStaticWebApp@0
            displayName: Deploy to Static Web Apps
            inputs:
              app_location: task-management-client/dist
              skip_app_build: true
              skip_api_build: true
              azure_static_web_apps_api_token: $(SWA_TOKEN)
